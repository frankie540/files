;中文地名不加\\b，仅英文国家代码加\\b防止域名内字母误匹配
custom_proxy_group=美国节点`url-test`(美|\\bUS\\b|\\bus\\b|\\bStates\\b)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=英国节点`url-test`(英|\\bUK\\b|\\buk\\b|\\bBritain\\b|\\bKingdom\\b|\\bEngland\\b)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=德国节点`url-test`(德|\\bDE\\b|\\bde\\b|\\bGermany\\b)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=香港节点`url-test`(港|\\bHK\\b|\\bhk\\b|Hong Kong|HongKong|hongkong)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=日本节点`url-test`(日本|\\bJP\\b|\\bjp\\b|\\bJapan\\b)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=新加坡节点`url-test`(新加坡|狮城|\\bSG\\b|\\bsg\\b|\\bSingapore\\b)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=荷兰节点`url-test`(荷兰|尼德兰|\\bNL\\b|\\bnl\\b|Netherlands|Holland|阿姆斯特丹|Amsterdam|AMS)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=阿联酋节点`url-test`(阿拉伯|阿联酋|\\b🇦🇪\\b|\\bAE\\b)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=♻️ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🚀 手动选择`select`.*
;设置分组标志位
;下方参数请勿修改
enable_rule_generator=true
overwrite_original_rules=true
